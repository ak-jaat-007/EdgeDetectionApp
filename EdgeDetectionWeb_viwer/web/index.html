<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Detection Web Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #00b4d8, #e63946);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            align-items: start;
        }
        
        .viewer-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .canvas-container {
            position: relative;
            background: #000000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        #frameCanvas {
            width: 100%;
            height: 480px;
            display: block;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .control-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #00b4d8, #0077b6);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 180, 216, 0.4);
        }
        
        .control-btn.secondary {
            background: linear-gradient(45deg, #e63946, #d00000);
        }
        
        .stats-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        
        .stat-item {
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #00b4d8;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        
        .status-bar {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 180, 216, 0.2);
            border-radius: 5px;
            text-align: center;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Edge Detection Web Viewer</h1>
            <p>Real-time visualization of processed camera frames with edge detection</p>
        </div>
        
        <div class="content">
            <div class="viewer-section">
                <div class="canvas-container">
                    <canvas id="frameCanvas" width="640" height="480"></canvas>
                </div>
                
                <div class="controls">
                    <button id="modeToggle" class="control-btn">Raw Feed</button>
                    <button id="loadSampleBtn" class="control-btn secondary">Load Sample Frame</button>
                </div>
                
                <div class="status-bar">
                    <span id="statusInfo">Ready - Loaded sample edge detection frame</span>
                </div>
            </div>
            
            <div class="stats-panel">
                <h2>Frame Statistics</h2>
                <div class="stat-item">
                    <div class="stat-label">FPS</div>
                    <div id="fpsCounter" class="stat-value">15.5</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">Resolution</div>
                    <div id="resolutionInfo" class="stat-value">640x480</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">Processing Time</div>
                    <div class="stat-value">45.2 ms</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">Frame Count</div>
                    <div class="stat-value">1,247</div>
                </div>
                
                <div class="stat-item">
                    <div class="stat-label">Connection</div>
                    <div class="stat-value" style="color: #4ade80;">Connected</div>
                </div>
            </div>
        </div>
    </div>

    <script src="dist/app.js" type="module"></script>
</body>
</html>
